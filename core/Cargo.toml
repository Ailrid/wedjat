[package]
name = "wedjat-core"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/*"
]


[workspace.dependencies]
nalgebra = { version = "0.35.0" }
opencv = { version = "0.100.1", features = ["clang-runtime"] }
image = "0.25.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rand = "0.10.2"
thiserror = "2.0.20"
anyhow = "1.0.100"
rknn-sys = { path = "crates/rknn-sys" }
rknn3 = { path = "crates/rknn3" }
client = { path = "crates/client" }
camera = { path = "crates/camera" }
imu = { path = "crates/imu" }

[dependencies]
imu = { path = "crates/imu" }
camera = { path = "crates/camera" }
engine = { path = "crates/engine" }
