[project]
name = "metric-export"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "metric-core", 
    "virid-core>=0.1.6",
    "numpy",
    "onnx==1.20.1",
    "onnxruntime",
    # "onnxruntime-gpu>=1.23.2",
    "matplotlib",
    "opencv-python",
    "qdrant-client",
    "tqdm",
    "rasterio",
    "torch"

]
[tool.hatch.build.targets.wheel]
packages = ["src/metric"]
# layout = "src"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
metric-core= { workspace = true }

